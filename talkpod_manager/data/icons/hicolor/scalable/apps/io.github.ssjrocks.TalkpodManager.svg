<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f6b46"/>
      <stop offset="0.5" stop-color="#4f8457"/>
      <stop offset="1" stop-color="#3a6341"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a8c"/>
      <stop offset="1" stop-color="#14254d"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <rect x="34" y="6" width="9" height="34" rx="4.5" fill="#2d2d2d"/>
  <rect x="31" y="34" width="15" height="8" rx="2" fill="#3a3a3a"/>
  <!-- knob -->
  <rect x="78" y="22" width="14" height="20" rx="3" fill="#2d2d2d"/>
  <rect x="80" y="24" width="2" height="16" fill="#505050"/>
  <rect x="84" y="24" width="2" height="16" fill="#505050"/>
  <rect x="88" y="24" width="2" height="16" fill="#505050"/>
  <!-- shadow -->
  <rect x="26" y="42" width="80" height="82" rx="14" fill="#000" opacity="0.18"/>
  <!-- body -->
  <rect x="24" y="38" width="80" height="84" rx="14" fill="url(#body)"/>
  <rect x="24" y="38" width="80" height="84" rx="14" fill="none" stroke="#2e5034" stroke-width="2"/>
  <!-- speaker grille -->
  <rect x="38" y="46" width="52" height="3" rx="1.5" fill="#2e5034"/>
  <rect x="38" y="52" width="52" height="3" rx="1.5" fill="#2e5034"/>
  <!-- screen -->
  <rect x="34" y="60" width="60" height="30" rx="4" fill="#1b1b1b"/>
  <rect x="37" y="63" width="54" height="24" rx="2" fill="url(#screen)"/>
  <rect x="40" y="66" width="22" height="3" rx="1" fill="#8fb8ff"/>
  <text x="64" y="84" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">476.4</text>
  <!-- keypad -->
  <g fill="#262626">
    <rect x="36" y="96" width="14" height="7" rx="3"/>
    <rect x="57" y="96" width="14" height="7" rx="3"/>
    <rect x="78" y="96" width="14" height="7" rx="3"/>
    <rect x="36" y="107" width="14" height="7" rx="3"/>
    <rect x="57" y="107" width="14" height="7" rx="3"/>
    <rect x="78" y="107" width="14" height="7" rx="3"/>
  </g>
  <rect x="38" y="97.5" width="5" height="2" rx="1" fill="#6fdc7a"/>
  <rect x="80" y="97.5" width="7" height="2" rx="1" fill="#e5533d"/>
</svg>
